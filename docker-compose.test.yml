# A throwaway Postgres for the test suite. Data lives in memory and is gone when it stops.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   KILN_TEST_POSTGRES_URL=postgres://kiln_test:kiln_test@localhost:55432/kiln_test pnpm test
#   docker compose -f docker-compose.test.yml down
#
# Each test creates its own schema in this database and drops it afterwards. Dropping a schema
# with the whole table set takes a lock per table and index, hence max_locks_per_transaction.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kiln_test
      POSTGRES_PASSWORD: kiln_test
      POSTGRES_DB: kiln_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Safe here only because nothing in this database is worth keeping.
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "max_locks_per_transaction=1024"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiln_test -d kiln_test"]
      interval: 2s
      timeout: 3s
      retries: 15
