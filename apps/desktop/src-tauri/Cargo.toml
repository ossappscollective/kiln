[package]
name = "kiln-desktop"
version = "0.0.0"
description = "Tauri shell for Kiln"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native desktop notifications for alerts (docs/alerts.md). Not compiled in the session that added it.
tauri-plugin-notification = "2"
# OS CSPRNG for the per-launch secret and the master key.
getrandom = "0.2"
