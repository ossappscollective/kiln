# One command: cp .env.example .env, set KILN_MASTER_KEY, then `docker compose up --build`.
# The Postgres user, database and the volume names below are `mrm` on purpose: they are what the data lives
# under, and renaming them would start an empty database (docs/adr/0040-rename-to-kiln.md).
services:
  app:
    build: .
    ports:
      # Loopback only by default: the server speaks plain HTTP. Put a TLS-terminating reverse proxy
      # in front (docs/deployment.md). Set KILN_BIND=0.0.0.0 to publish on every interface.
      - "${KILN_BIND:-127.0.0.1}:8787:8787"
    # Every KILN_* switch in .env (feature flags, AI, analytics, translation, KILN_SMTP_* mail...) reaches the container. The values under
    # `environment:` below win over the file.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://mrm:mrm@db:5432/mrm
      KILN_MASTER_KEY: ${KILN_MASTER_KEY:?Set KILN_MASTER_KEY in .env (openssl rand -base64 32)}
      KILN_DATA_DIR: /data
      KILN_WEB_DIST: apps/web/dist
    volumes:
      - mrm-data:/data
      # Signed local commits (KILN_GIT_SIGN, docs/deployment.md): mount the key read-only (mode 600,
      # readable by the `node` user) and set KILN_GIT_SIGNING_KEY to the path INSIDE the container.
      # Left commented because a missing file would stop the container from starting.
      # - ./secrets/kiln_signing:/run/secrets/kiln_signing:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mrm
      POSTGRES_PASSWORD: mrm
      POSTGRES_DB: mrm
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrm -d mrm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mrm-data:
  pg-data:
