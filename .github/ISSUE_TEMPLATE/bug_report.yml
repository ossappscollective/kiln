name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not paste secrets, store credentials, tokens or customer data.
        For security problems use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Does it also happen in demo mode (`pnpm demo`)?
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How do you run Kiln?
      options: [Docker, Docker Compose, Desktop app, From source, Demo mode]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kiln version or commit
  - type: dropdown
    id: db
    attributes:
      label: Database
      options: [SQLite, Postgres]
  - type: input
    id: platform
    attributes:
      label: OS, browser, Node version
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
